# Builds Prism's packages when a version tag (v0.2.0, ...) is pushed, or
# when started by hand from the Actions tab. They're attached to a DRAFT
# release for the maintainer to check and publish.
#
# Built on Ubuntu 22.04 so the packages also run on older systems.
name: Release packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file pkg-config libssl-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libhidapi-dev libudev-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Tests
        run: cargo test --workspace

      - name: Build packages
        run: |
          npm ci
          npx tauri build --bundles deb,rpm,appimage

      - name: Attach to a draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
