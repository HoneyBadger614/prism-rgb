[workspace]
resolver = "2"
members = ["crates/prism-core", "crates/prism-input", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["HoneyBadger"]

# Prism runs in the background a lot, so the real build is optimized for
# size and speed.
[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
